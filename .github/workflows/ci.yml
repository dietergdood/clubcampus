name: CI

on:
  push:
    branches: [main, ts-migration]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Typecheck, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 22 LTS: deckt die engines-Anforderungen von rolldown/oxc (>=20.19 / 22.12)
          # ab und vermeidet die Node-20-Deprecation der Runner-Actions.
          node-version: 22
          cache: npm

      # `npm ci` scheitert hier am bekannten npm-Cross-Platform-Bug: die
      # package-lock.json wurde unter Windows erzeugt, und npms strikte
      # Prüfung der optionalen Native-Bindings (esbuild/rolldown/rollup)
      # schlägt beim Install auf Linux fehl. `npm install` installiert
      # dieselbe Lockfile deterministisch (Vercel baut so denselben Commit
      # auf Linux erfolgreich). `--no-save` verhindert Lockfile-Drift.
      - name: Install dependencies
        run: npm install --no-save --no-audit --no-fund

      # Kernschritt: haelt die TypeScript-Typsicherheit gruen.
      - name: Typecheck
        run: npm run typecheck

      # ESLint blockt nur bei error-Level-Regeln (rules-of-hooks +
      # Import-Richtung). Die ~750 warn-Level-Meldungen (any, unused,
      # exhaustive-deps, max-lines) lassen `eslint .` mit Exit 0 durch
      # und werden schrittweise abgebaut.
      - name: Lint
        run: npm run lint

      - name: Fehlende Konstanten-Imports pruefen
        run: npm run check:imports

      # Spaltennamen in select()-Zeichenketten gegen database.types.ts.
      # Findet, was Build und Typecheck nicht sehen koennen: die Select-Liste
      # ist eine Zeichenkette. Am 20.08.2026 stand darin `profil_geprueft_at`
      # auf `mitglieder` — seit Etappe 6a eine tote Spalte. PostgREST
      # antwortete mit 400, der Aufrufer las nur `data`, und die
      # Datenpruefung meldete „Keine Kinder verknuepft".
      - name: Select-Spalten gegen die Typen pruefen
        run: npm run check:selects

      # Ein deutsches Anfuehrungszeichen, dessen SCHLIESSENDES Zeichen ein
      # ASCII-" ist, beendet einen "-String mittendrin. Der Build meldet das
      # zwar, aber als Parserfehler drei Zeilen weiter — und die Regel dagegen
      # stand seit dem 23.08.2026 in CLAUDE.md, waehrend es noch dreimal
      # passiert ist. Wo eine Regel nicht traegt, gehoert eine Pruefung hin.
      - name: Anfuehrungszeichen in Stringliteralen pruefen
        run: npm run check:quotes

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
